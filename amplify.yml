version: 1
# Deploys the real backend on every build: `ampx pipeline-deploy` provisions
# the Amplify app's resources (including the rankOpportunities function,
# which reads ANTHROPIC_API_KEY from this app's Hosting secrets) and writes
# amplify_outputs.json before the frontend build runs, so src/aiRanking.js
# finds a live backend and isMockAi is false - the bundled sample AI ranking
# is only ever a fallback for a build or environment where that file is
# missing or VITE_USE_MOCK_AI is explicitly set.
backend:
  phases:
    build:
      commands:
        # npm install, not npm ci - see the frontend preBuild note below.
        - npm install
        - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
frontend:
  phases:
    preBuild:
      commands:
        # npm install instead of npm ci: Amplify's build image resolves
        # packages itself (its Node/npm differ from the versions used to
        # generate package-lock.json locally, which was making npm ci reject
        # the lock file as out of sync). Revisit once the lock file is
        # regenerated with matching versions.
        - npm install
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
