version: 1
# Backend build disabled until the AWS auth/permissions issue blocking
# `ampx pipeline-deploy` is fixed - restore this block to deploy the
# backend again. Until then Amplify builds the front end only, and the
# site falls back to the bundled sample AI ranking (src/aiRanking.js).
# backend:
#   phases:
#     build:
#       commands:
#         - npm ci
#         - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
frontend:
  phases:
    preBuild:
      commands:
        # npm install instead of npm ci: Amplify's build image resolves
        # packages itself (its Node/npm differ from the versions used to
        # generate package-lock.json locally, which was making npm ci reject
        # the lock file as out of sync). Revisit once the lock file is
        # regenerated with matching versions.
        - npm install
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
