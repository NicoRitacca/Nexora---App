version: 1
# Backend build disabled until the AWS auth/permissions issue blocking
# `ampx pipeline-deploy` is fixed - restore this block to deploy the
# backend again. Until then Amplify builds the front end only, and the
# site falls back to the bundled sample AI ranking (src/aiRanking.js).
# backend:
#   phases:
#     build:
#       commands:
#         - npm ci
#         - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
